;;============================================================================
;;  colors.ini — Material Design 3 color roles для polybar
;;----------------------------------------------------------------------------
;;  СГЕНЕРИРОВАНО АВТОМАТИЧЕСКИ из tools/templates/polybar-colors.ini.template
;;  Источник правды: generated/theme-state.json → tools/md3_theme.py
;;
;;  Каждое имя = роль md.sys.color.* (см. https://m3.material.io/styles/color/roles).
;;  Формат polybar: #AARRGGBB (альфа ПЕРВЫМ байтом).
;;
;;  source color : #6750A4
;;  scheme       : tonal-spot / standard / dark
;;  генератор    : material-color-utilities (MaterialDynamicColors)
;;============================================================================

[colors]
;; --- md.sys.color: surface & content --------------------------------------
background            = #ff141218
on-background         = #ffe6e0e9
surface               = #ff141218
on-surface            = #ffe6e0e9
surface-variant       = #ff49454e
on-surface-variant    = #ffcac4cf
surface-dim           = #ff141218
surface-bright        = #ff3b383e
surface-container-lowest  = #ff0f0d13
surface-container-low     = #ff1d1b20
surface-container         = #ff211f24
surface-container-high    = #ff2b292f
surface-container-highest = #ff36343a
inverse-surface       = #ffe6e0e9
inverse-on-surface    = #ff322f35

;; --- md.sys.color: accents -------------------------------------------------
primary               = #ffcfbdfe
on-primary            = #ff36275d
primary-container     = #ff4d3d75
on-primary-container  = #ffe9ddff
inverse-primary       = #ff65558f
secondary             = #ffcbc2db
on-secondary          = #ff332d41
secondary-container   = #ff4a4458
on-secondary-container= #ffe8def8
tertiary              = #ffefb8c8
on-tertiary           = #ff4a2532
tertiary-container    = #ff633b48
on-tertiary-container = #ffffd9e3
error                 = #ffffb4ab
on-error              = #ff690005
error-container       = #ff93000a
on-error-container    = #ffffdad6

;; --- md.sys.color: outline -------------------------------------------------
outline               = #ff948f99
outline-variant       = #ff49454e
shadow                = #52000000
scrim                 = #ff000000
surface-tint          = #ffcfbdfe

;; --- md.sys.elevation: surface + overlay(surfaceTint) ----------------------
elevation0            = #ff141218
elevation1            = #ff1d1b24
elevation2            = #ff23202a
elevation3            = #ff292531
elevation4            = #ff2a2734
elevation5            = #ff2e2a38

;; --- семантические алиасы для модулей polybar ------------------------------
;; Панель — surface-container уровня elevation 2 (M3: «bar» = raised surface)
bar-bg                = #ff23202a
bar-fg                = #ffe6e0e9
tray-bg               = #ff2b292f

;; Рабочие столы (md.comp: navigation-item / primary indicator)
ws-focused            = #ff4d3d75   ;; фон активного стола
ws-focused-fg         = #ffe9ddff
ws-occupied           = #ff4a4458 ;; фон занятого стола
ws-occupied-fg        = #ffe8def8
ws-urgent             = #ff93000a
ws-urgent-fg          = #ffffdad6
ws-empty              = #00000000
ws-empty-fg           = #ffcac4cf

;; Акценты модулей
clock-bg              = #ffcfbdfe
clock-fg              = #ff36275d
badge-bg              = #ff633b48
badge-fg              = #ffffd9e3
bar-fill              = #ffcfbdfe
bar-empty             = #ff36343a
separator             = #ff49454e
transparent           = #00000000
